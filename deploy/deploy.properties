# Cấu hình triển khai. Sửa file này rồi chạy: sudo bash deploy/deploy.sh
# Mật khẩu cơ sở dữ liệu và SESSION_SECRET để trống: script sinh một lần, ghi vào .env, lần sau không đổi.
# Khóa API nếu điền ở đây thì đừng đẩy file này lên git.

# --- Máy chủ SSH (chỉ dùng khi chạy script từ máy cá nhân) ---
SSH_HOST=
SSH_PORT=22
SSH_USER=root
# Dán một dòng khóa công khai. Để trống nếu chưa có.
SSH_PUBLIC_KEY=
# true = tắt đăng nhập SSH bằng mật khẩu. Chỉ bật khi đã đăng nhập được bằng khóa.
DISABLE_SSH_PASSWORD=false

# --- Phần mềm ---
NODE_MAJOR=24
POSTGRES_VERSION=18
TIMEZONE=Asia/Ho_Chi_Minh
# 0 = không tạo. VPS RAM thấp nên để 2048 để next build khỏi chết.
SWAP_MB=2048
NODE_OPTIONS=--max-old-space-size=2048

# --- Ứng dụng ---
APP_DIR=/var/www/lienvietdoor
APP_PORT=3000
PM2_NAME=lienvietdoor
# Để trống nếu mã đã nằm trong APP_DIR. Có git thì điền URL.
GIT_REPO_URL=
GIT_BRANCH=main
# true = git pull khi thư mục đã là repo. false = giữ nguyên mã đang có trên máy.
GIT_PULL=false
# true chỉ có tác dụng lần đầu (chưa có file .deploy-seeded).
RUN_SEED=true

# --- Tên miền, Nginx, chứng chỉ ---
DOMAIN=lienvietdoor.vn
DOMAIN_WWW=www.lienvietdoor.vn
# Bắt buộc khi ENABLE_SSL=true.
LETSENCRYPT_EMAIL=
ENABLE_SSL=true
KIEM_TRA_DNS=true
UPLOAD_MB=50
ENABLE_UFW=true

# --- PostgreSQL ---
DB_NAME=lienvietdoor
DB_USER=lvd
DB_PASSWORD=

# --- Biến môi trường ứng dụng (ghi vào .env) ---
SESSION_SECRET=
DASHBOARD_DATA_SOURCE=live
SHOW_PLANNED_MODULES=true
STORAGE_DRIVER=may_chu
S3_BUCKET=
S3_REGION=
S3_ACCESS_KEY_ID=
S3_SECRET_ACCESS_KEY=
S3_PREFIX=
ANTHROPIC_API_KEY=
ANTHROPIC_MODEL=
